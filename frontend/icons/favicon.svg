<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="60%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>
    <linearGradient id="fav-bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0044B8"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <linearGradient id="fav-bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0066E6"/>
      <stop offset="100%" stop-color="#00C4FF"/>
    </linearGradient>
    <linearGradient id="fav-bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Tile with Subtle Border -->
  <rect width="64" height="64" rx="14" fill="#070913"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(0, 245, 255, 0.28)" stroke-width="1.2"/>

  <!-- Geometric "D" Frame Scaled to 64x64 (Padding: 10px) -->
  <path d="M 14,10
           L 34,10
           C 47,10 54,18 54,32
           C 54,46 47,54 34,54
           L 14,54
           C 12,54 10,52 10,50
           L 10,14
           C 10,12 12,10 14,10 Z
           M 17,17
           L 17,47
           L 33,47
           C 42,47 47,40 47,32
           C 47,24 42,17 33,17
           Z"
        fill="url(#fav-outer)"
        fill-rule="evenodd"/>

  <!-- Ascending Data Bars inside "D" -->
  <rect x="21" y="33" width="5" height="14" rx="1.5" fill="url(#fav-bar1)"/>
  <rect x="28" y="25" width="5" height="22" rx="1.5" fill="url(#fav-bar2)"/>
  <rect x="35" y="17" width="5" height="30" rx="1.5" fill="url(#fav-bar3)"/>
</svg>
